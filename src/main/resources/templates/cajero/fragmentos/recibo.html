<div th:fragment="comprobante" class="modal-overlay" style="backdrop-filter: blur(8px); opacity: 1; pointer-events: auto; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(10, 14, 23, 0.8); z-index: 2000; display: flex; align-items: center; justify-content: center;" id="receipt-modal">
    <div class="modal-container" style="background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); width: 90%; max-width: 450px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column;">
        <div class="modal-header" style="padding: 20px 24px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between;">
            <h3 class="modal-title" style="font-size: 1.25rem; color: white;">🧾 Comprobante de Pago</h3>
            <button class="modal-close" onclick="location.reload()" style="background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.5rem; width: 32px; height: 32px; border-radius: 50%;">&times;</button>
        </div>
        <div class="modal-body" style="padding: 24px;">
            <div style="text-align:center; font-family:monospace; color:var(--text-secondary);">
                <h2 style="color:white; margin-bottom:10px;">EN SU PUNTO SAC</h2>
                <p>RUC: 20123456789</p>
                <p>Av. Principal 123, Lima</p>
                <hr style="border-color:#333; margin:10px 0;">
                <h3 style="color:white;">BOLETA ELECTRÓNICA</h3>
                <p style="font-size:1.2rem; font-weight:bold;" th:text="${boletaNum}">B001-000001</p>
                <hr style="border-color:#333; margin:10px 0;">
                <div style="display:flex; justify-content:space-between; font-size:1.2rem; font-weight:bold; color:var(--accent);">
                    <span>TOTAL:</span>
                    <span th:text="'S/ ' + ${#numbers.formatDecimal(total, 1, 2)}">S/ 0.00</span>
                </div>
                <p style="margin-top:20px;">¡Gracias por su preferencia!</p>
            </div>
        </div>
        <div class="modal-footer" style="padding: 16px 24px; border-top: 1px solid var(--border-color); background-color: rgba(10, 14, 23, 0.4); display: flex; align-items: center; justify-content: flex-end; gap: 12px;">
            <button class="btn btn-secondary" onclick="window.print()">Imprimir</button>
            <button class="btn btn-primary" onclick="location.reload()">Cerrar Mesa</button>
        </div>
    </div>
</div>
