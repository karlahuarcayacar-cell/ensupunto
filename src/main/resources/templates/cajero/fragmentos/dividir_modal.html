<!-- 
  =============================================================================
  PROYECTO ACADÉMICO - EN SU PUNTO (Modal de Configuración para Dividir Cuenta)
  PROPÓSITO:
  - Ventana modal que permite ingresar el número de clientes en el que se va a 
    dividir la cuenta por partes iguales, y procesa la creación de las fracciones correspondientes.
  
  TECNOLOGÍAS EXPLICADAS:
  1. Thymeleaf:
     - th:fragment="modal": Declara este bloque como el fragmento modal cargable de forma modular.
     - th:hx-post: Resuelve dinámicamente la URL POST de HTMX para la mesa/pedido actual.
  2. HTMX:
     - hx-target="#cashier-right-panel": Redirecciona la respuesta HTML del servidor
       (que contiene la lista de fracciones creadas) al panel lateral derecho, reemplazándolo.
     - hx-on::after-request: Evento JavaScript que destruye la ventana modal actual del DOM
       al completarse satisfactoriamente la petición AJAX de división.
  3. Contexto de Datos:
     - ${pedidoId}: Identificador del pedido actual que se va a dividir.
  =============================================================================
-->
<div th:fragment="modal" class="modal-overlay" style="backdrop-filter: blur(8px); opacity: 1; pointer-events: auto; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(10, 14, 23, 0.8); z-index: 2000; display: flex; align-items: center; justify-content: center;" id="split-prompt-modal">
    <div class="modal-container" style="background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); width: 90%; max-width: 450px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column;">
        <div class="modal-header" style="padding: 20px 24px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between;">
            <h3 class="modal-title" style="font-size: 1.25rem; color: white;">⚖️ Dividir Cuenta</h3>
            <!-- Cierra el modal eliminando su elemento contenedor directamente desde el cliente -->
            <button class="modal-close" onclick="this.closest('.modal-overlay').remove()" style="background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.5rem; width: 32px; height: 32px; border-radius: 50%;">&times;</button>
        </div>
        <!-- HTMX: Envía la petición POST asíncrona para dividir y actualizar el panel lateral -->
        <form th:hx-post="'/cajero/pedidos/' + ${pedidoId} + '/dividir'" hx-target="#cashier-right-panel" hx-on::after-request="this.closest('.modal-overlay').remove()">
            <div class="modal-body" style="padding: 24px;">
                <div class="form-group">
                    <label style="color:var(--text-secondary);">Número de personas para dividir la cuenta:</label>
                    <input type="number" name="nPartes" class="form-control" value="2" min="2" max="10" style="width:100%; padding:8px; margin-top:5px; background:var(--bg-tertiary); border:1px solid var(--border-color); color:white; border-radius:4px;">
                </div>
            </div>
            <div class="modal-footer" style="padding: 16px 24px; border-top: 1px solid var(--border-color); background-color: rgba(10, 14, 23, 0.4); display: flex; align-items: center; justify-content: flex-end; gap: 12px;">
                <button type="button" class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Confirmar</button>
            </div>
        </form>
    </div>
</div>
