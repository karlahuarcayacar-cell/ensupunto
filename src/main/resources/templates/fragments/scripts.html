<!DOCTYPE html>
<!-- 
    FRAGMENTO DE SCRIPTS THYMELEAF
    
    CONCEPTOS ACADÉMICOS CLAVE:
    1. Fragmentos Reutilizables (Thymeleaf Layouts):
       - th:fragment="commonScripts": Define un bloque reusable de código que puede ser
         incluido en cualquier plantilla HTML (como layout.html, salon.html, cajero.html)
         mediante th:replace o th:insert, evitando duplicar código de importaciones de JS.
         
    2. Integración de HTMX con Componentes Dinámicos (Modales):
       - interceptamos el evento global 'htmx:confirm' para reemplazar el cuadro de alerta
         nativo del navegador (window.confirm) por un modal premium estilizado de CSS,
         reteniendo la petición AJAX hasta que el usuario haga clic en "Confirmar".
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="commonScripts">
        <!-- Reemplaza o inserta la estructura HTML del modal global definida en fragments/modal.html -->
        <th:block th:replace="~{fragments/modal :: globalModal}"></th:block>
        
        <!-- Importación del motor de interactividad HTMX -->
        <script src="https://unpkg.com/htmx.org@1.9.10"></script>
        
        <script>
            /**
             * Genera y abre dinámicamente el Modal Global con títulos, cuerpo HTML y botones personalizados.
             * 
             * @param {string} title Título del modal.
             * @param {string} bodyHtml Cuerpo del modal (HTML embebido).
             * @param {Array} buttons Configuración de botones con sus respectivas funciones callback.
             */
            function showCustomModal(title, bodyHtml, buttons) {
                document.getElementById('global-modal-title').innerHTML = title;
                document.getElementById('global-modal-body').innerHTML = bodyHtml;
                
                const footer = document.getElementById('global-modal-footer');
                footer.innerHTML = ''; // Limpia botones anteriores
                
                // Construye dinámicamente los botones pasados por parámetro
                if (buttons && buttons.length > 0) {
                    buttons.forEach(btn => {
                        const button = document.createElement('button');
                        button.className = 'btn ' + (btn.class || 'btn-secondary');
                        button.innerText = btn.text;
                        button.onclick = () => {
                            if (btn.onClick) {
                                btn.onClick();
                            } else {
                                closeGlobalModal();
                            }
                        };
                        footer.appendChild(button);
                    });
                } else {
                    // Botón por defecto "Entendido" si no se especifican botones
                    const closeBtn = document.createElement('button');
                    closeBtn.className = 'btn btn-primary';
                    closeBtn.innerText = 'Entendido';
                    closeBtn.onclick = closeGlobalModal;
                    footer.appendChild(closeBtn);
                }

                // Efectos de transición CSS para mostrar el overlay
                const overlay = document.getElementById('global-modal-overlay');
                overlay.style.opacity = '1';
                overlay.style.pointerEvents = 'auto';
                overlay.querySelector('.modal-container').style.transform = 'scale(1)';
            }

            /**
             * Cierra el Modal Global aplicando efectos de transición inversa.
             */
            function closeGlobalModal() {
                const overlay = document.getElementById('global-modal-overlay');
                overlay.style.opacity = '0';
                overlay.style.pointerEvents = 'none';
                overlay.querySelector('.modal-container').style.transform = 'scale(0.95)';
            }

            /**
             * INTERCEPTOR DE CONFIRMACIONES DE HTMX
             * 
             * Cuando un elemento posee la propiedad 'hx-confirm="¿Pregunta?"', HTMX dispara
             * el evento 'htmx:confirm'. Lo interceptamos, detenemos la petición AJAX automática
             * (evt.preventDefault()) y abrimos nuestro modal global.
             * Si el usuario confirma, llamamos a 'evt.detail.issueRequest(true)' indicando a
             * HTMX que continúe con el envío del flujo Ajax.
             */
            document.body.addEventListener('htmx:confirm', function(evt) {
                // Si el evento no posee pregunta de confirmación, continúa el flujo regular
                if (!evt.detail.question) {
                    return;
                }
                
                // Detiene el envío inmediato de la petición
                evt.preventDefault();
                
                // Lanza el modal estilizado
                showCustomModal("Confirmar Acción", `<p style="color:white; margin:10px 0;">${evt.detail.question}</p>`, [
                    {
                        text: "Cancelar",
                        class: "btn-secondary",
                        onClick: function() {
                            closeGlobalModal();
                        }
                    },
                    {
                        text: "Confirmar",
                        class: "btn-primary",
                        onClick: function() {
                            closeGlobalModal();
                            // Indica a HTMX que continúe con la llamada AJAX asíncrona
                            evt.detail.issueRequest(true);
                        }
                    }
                ]);
            });

            /**
             * Formatea números reales a moneda peruana (Ej. 10.5 a "S/ 10.50").
             */
            function formatCurrency(amount) {
                return 'S/ ' + parseFloat(amount).toFixed(2);
            }
        </script>
    </th:block>
</body>
</html>
