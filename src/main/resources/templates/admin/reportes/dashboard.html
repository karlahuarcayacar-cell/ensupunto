<div th:fragment="content">
    <div class="reports-layout">
        <div class="glass-card chart-card">
            <h3 class="chart-title" style="border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:15px;">Distribución por Métodos de Pago (S/.)</h3>
            <div class="chart-canvas-container" style="height:280px;">
                <canvas id="salesChart"></canvas>
            </div>
        </div>
        <div class="glass-card chart-card">
            <h3 class="chart-title" style="border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:15px;">Top 5 Platos Más Vendidos (Unidades)</h3>
            <div class="chart-canvas-container" style="height:280px;">
                <canvas id="topDishesChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Historial -->
    <div class="glass-card" style="margin-top: 20px;">
        <h3 style="color:white; margin-bottom:15px; font-size:1rem;">Historial de Pedidos Cobrados (Hoy)</h3>
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Mesa</th>
                    <th>Ítems</th>
                    <th>Método Pago</th>
                    <th>Hora Pago</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${historialHoy}">
                    <td style="color:white;" th:text="${p.mesa.nombre}">Mesa</td>
                    <td style="color:var(--text-secondary); max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                        <span th:each="d, iter : ${p.detalles}" th:text="${d.cantidad} + 'x ' + ${d.plato.nombre} + (iter.last ? '' : ', ')"></span>
                    </td>
                    <td><span class="role-pill" th:classappend="${p.metodoPago}" th:text="${#strings.toUpperCase(p.metodoPago)}">EFECTIVO</span></td>
                    <td style="color:var(--text-secondary);" th:text="${#temporals.format(p.fechaPago, 'HH:mm')}">12:00</td>
                    <td style="color:var(--accent); font-weight:700;" th:text="${#numbers.formatCurrency(p.total)}">S/ 0.00</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Script para inicializar charts -->
    <script th:inline="javascript">
        (function() {
            const dataVentas = [[${ventasCategoria}]];
            const dataTopPlatos = [[${topPlatos}]];

            const ctx = document.getElementById('salesChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: dataVentas.categorias,
                    datasets: [{ data: dataVentas.valores, backgroundColor: ['#ff6600','#3b82f6','#10b981','#8b5cf6'], borderWidth: 0 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 11 } } } } }
            });

            const ctxTop = document.getElementById('topDishesChart').getContext('2d');
            new Chart(ctxTop, {
                type: 'bar',
                data: {
                    labels: dataTopPlatos.nombres,
                    datasets: [{ label: 'Unidades', data: dataTopPlatos.cantidades, backgroundColor: '#ff6600', borderRadius: 4 }]
                },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { grid: { color: '#333' }, ticks: { color: '#94a3b8' } },
                        y: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        })();
    </script>
</div>
