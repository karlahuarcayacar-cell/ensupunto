<div th:fragment="content">
    <div class="glass-card">
        <h3 style="color:white; font-size:1.1rem; margin-bottom:15px;">Reporte por Período</h3>
        <form hx-get="/admin/reportes/personalizado/buscar" hx-target="#periodo-resultado" style="display:flex; gap:15px; align-items:center; flex-wrap:wrap; margin-bottom:20px;">
            <div>
                <label style="color:var(--text-secondary); font-size:0.8rem; display:block; margin-bottom:5px;">Desde</label>
                <input type="date" name="desde" id="fecha-desde" class="date-input" required>
            </div>
            <div>
                <label style="color:var(--text-secondary); font-size:0.8rem; display:block; margin-bottom:5px;">Hasta</label>
                <input type="date" name="hasta" id="fecha-hasta" class="date-input" required>
            </div>
            <div style="align-self:flex-end;">
                <button type="submit" class="btn btn-primary">🔍 Buscar</button>
            </div>
        </form>
        
        <div id="periodo-resultado">
            <!-- Los resultados de la búsqueda aparecerán aquí -->
            <p style="color:var(--text-secondary); font-size:0.85rem;">Selecciona un rango de fechas para buscar.</p>
        </div>
    </div>
</div>
