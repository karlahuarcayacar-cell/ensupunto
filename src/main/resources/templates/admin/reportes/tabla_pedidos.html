<div th:fragment="render(pedidos, titulo, subtitulo, downloadUrl, previewUrl)">
    <div class="glass-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <div>
                <h3 style="color:white; font-size:1.1rem;" th:text="${titulo}">Título</h3>
                <p style="color:var(--text-secondary); font-size:0.85rem;" th:text="${subtitulo}">Subtítulo</p>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-secondary" th:attr="onclick=|previsualizarReporteVentas('${previewUrl}')|">👁️ Vista Previa</button>
                <button class="btn btn-secondary" onclick="imprimirReporteVentas()">🖨️ Imprimir</button>
                <a th:href="${downloadUrl}" target="_blank" class="btn btn-primary">⬇️ Descargar PDF</a>
            </div>
        </div>
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Mesa</th>
                    <th>Mesero</th>
                    <th>Ítems</th>
                    <th>Método Pago</th>
                    <th>Fecha/Hora Pago</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${pedidos}">
                    <td style="color:white;" th:text="${p.mesa.nombre}">Mesa</td>
                    <td style="color:var(--text-secondary);" th:text="${p.mesero != null ? p.mesero.nombre : '-'}">Mesero</td>
                    <td style="color:var(--text-secondary); max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                        <span th:each="d, iter : ${p.detalles}" th:text="${d.cantidad} + 'x ' + ${d.plato.nombre} + (iter.last ? '' : ', ')"></span>
                    </td>
                    <td><span class="role-pill" th:classappend="${p.metodoPago}" th:text="${#strings.toUpperCase(p.metodoPago)}">EFECTIVO</span></td>
                    <td style="color:var(--text-secondary);" th:text="${#temporals.format(p.fechaPago, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                    <td style="color:var(--accent); font-weight:700;" th:text="${#numbers.formatCurrency(p.total)}">S/ 0.00</td>
                </tr>
            </tbody>
        </table>
        <!-- Resumen & Controles de Paginación -->
        <div style="margin-top:15px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <div style="color:var(--text-secondary); font-size:0.85rem;">
                Total registros: <strong style="color:white;" th:text="${totalElements}">0</strong>
                &nbsp;&nbsp;|&nbsp;&nbsp;
                Total vendido: <strong style="color:var(--accent); font-size:1rem;" th:text="${#numbers.formatCurrency(totalVendido)}">S/ 0.00</strong>
            </div>
            
            <!-- Controles de Paginación -->
            <div th:if="${totalPages > 1}" style="display:flex; align-items:center; gap:12px;">
                <button class="btn btn-secondary btn-sm"
                        th:if="${currentPage > 0}"
                        th:hx-get="'/admin/reportes/ventas/filtrar?tipo=' + ${tipo} + '&desde=' + ${desde ?: ''} + '&hasta=' + ${hasta ?: ''} + '&page=' + ${currentPage - 1}"
                        hx-target="#ventas-reporte-resultado"
                        hx-indicator="#buscar-loading"
                        style="padding: 5px 12px; font-size: 0.8rem;">◀ Anterior</button>
                
                <span style="color: var(--text-secondary); font-size: 0.8rem; font-weight: 600;" 
                      th:text="'Página ' + (${currentPage + 1}) + ' de ' + ${totalPages}">Página 1 de 1</span>
                
                <button class="btn btn-secondary btn-sm"
                        th:if="${currentPage + 1 < totalPages}"
                        th:hx-get="'/admin/reportes/ventas/filtrar?tipo=' + ${tipo} + '&desde=' + ${desde ?: ''} + '&hasta=' + ${hasta ?: ''} + '&page=' + ${currentPage + 1}"
                        hx-target="#ventas-reporte-resultado"
                        hx-indicator="#buscar-loading"
                        style="padding: 5px 12px; font-size: 0.8rem;">Siguiente ▶</button>
            </div>
        </div>
    </div>

    <!-- Vista previa del reporte (oculto hasta que se solicite) -->
    <div id="preview-container" style="display:none; margin-top:20px;">
        <div class="glass-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3 style="color:white; font-size:1rem; margin:0;">Vista Previa del Reporte</h3>
                <div id="preview-loading" style="color:var(--text-secondary); font-size:0.8rem;">Cargando...</div>
            </div>
            <iframe id="preview-iframe" style="width:100%; height:600px; border:none; border-radius:var(--radius-md); background:white;"
                    onload="document.getElementById('preview-loading').style.display='none';"></iframe>
        </div>
    </div>

    <!-- Script de vista previa incorporado dentro del fragmento para ejecución de HTMX -->
    <script>
    function previsualizarReporteVentas(url) {
        const container = document.getElementById('preview-container');
        const iframe = document.getElementById('preview-iframe');
        const loading = document.getElementById('preview-loading');

        loading.style.display = 'block';
        iframe.src = url;
        container.style.display = 'block';
        container.scrollIntoView({ behavior: 'smooth' });
    }

    function imprimirReporteVentas() {
        const iframe = document.getElementById('preview-iframe');
        if (!iframe || !iframe.src) {
            alert('Primero genera la Vista Previa del reporte.');
            return;
        }
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
    }
    </script>
</div>
