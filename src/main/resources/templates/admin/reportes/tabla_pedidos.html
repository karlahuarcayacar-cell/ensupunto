<div th:fragment="render(pedidos, titulo, subtitulo, downloadUrl, previewType)">
    <div class="glass-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <div>
                <h3 style="color:white; font-size:1.1rem;" th:text="${titulo}">Título</h3>
                <p style="color:var(--text-secondary); font-size:0.85rem;" th:text="${subtitulo}">Subtítulo</p>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-secondary" th:onclick="'previsualizarReporte(\'' + ${previewType} + '\')'">👁️ Vista Previa</button>
                <button class="btn btn-secondary" onclick="imprimirPreview()">🖨️ Imprimir</button>
                <a th:href="${downloadUrl}" target="_blank" class="btn btn-primary">⬇️ Descargar PDF</a>
            </div>
        </div>
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Mesa</th>
                    <th>Mesero</th>
                    <th>Ítems</th>
                    <th>Método Pago</th>
                    <th>Fecha/Hora Pago</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${pedidos}">
                    <td style="color:white;" th:text="${p.mesa.nombre}">Mesa</td>
                    <td style="color:var(--text-secondary);" th:text="${p.mesero != null ? p.mesero.nombre : '-'}">Mesero</td>
                    <td style="color:var(--text-secondary); max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                        <span th:each="d, iter : ${p.detalles}" th:text="${d.cantidad} + 'x ' + ${d.plato.nombre} + (iter.last ? '' : ', ')"></span>
                    </td>
                    <td><span class="role-pill" th:classappend="${p.metodoPago}" th:text="${#strings.toUpperCase(p.metodoPago)}">EFECTIVO</span></td>
                    <td style="color:var(--text-secondary);" th:text="${#temporals.format(p.fechaPago, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                    <td style="color:var(--accent); font-weight:700;" th:text="${#numbers.formatCurrency(p.total)}">S/ 0.00</td>
                </tr>
            </tbody>
        </table>
        <div style="margin-top:15px; text-align:right;">
            <span style="color:var(--text-secondary);">Total registros: <strong style="color:white;" th:text="${#lists.size(pedidos)}">0</strong></span>
            &nbsp;&nbsp;
            <span style="color:var(--text-secondary);">Total vendido: <strong style="color:var(--accent); font-size:1.1rem;" th:text="${#numbers.formatCurrency(totalVendido != null ? totalVendido : 0)}">S/ 0.00</strong></span>
        </div>
    </div>

    <!-- Vista previa del reporte (oculto hasta que se solicite) -->
    <div id="preview-container" style="display:none; margin-top:20px;">
        <div class="glass-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3 style="color:white; font-size:1rem; margin:0;">Vista Previa del Reporte</h3>
                <div id="preview-loading" style="color:var(--text-secondary); font-size:0.8rem;">Cargando...</div>
            </div>
            <iframe id="preview-iframe" style="width:100%; height:600px; border:none; border-radius:var(--radius-md); background:white;"
                    onload="document.getElementById('preview-loading').style.display='none';"></iframe>
        </div>
    </div>
</div>

<!-- Script global de vista previa (colocar al final del archivo, fuera del fragment, o en un fragment aparte si se incluye en varios templates) -->
<script th:fragment="preview-script">
function previsualizarReporte(tipo) {
    const container = document.getElementById('preview-container');
    const iframe = document.getElementById('preview-iframe');
    const loading = document.getElementById('preview-loading');
    let url = '';

    if (tipo === 'personalizado') {
        const desde = document.getElementById('desdeInput')?.value;
        const hasta = document.getElementById('hastaInput')?.value;
        if (!desde || !hasta) {
            alert('Selecciona ambas fechas (Desde / Hasta) antes de generar la vista previa.');
            return;
        }
        url = `/admin/reporte/preview/personalizado?desde=${desde}&hasta=${hasta}`;
    } else {
        url = `/admin/reporte/preview/${tipo}`;
    }

    loading.style.display = 'block';
    iframe.src = url;
    container.style.display = 'block';
    container.scrollIntoView({ behavior: 'smooth' });
}

function imprimirPreview() {
    const iframe = document.getElementById('preview-iframe');
    if (!iframe.src) {
        alert('Primero genera la Vista Previa del reporte.');
        return;
    }
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
}
</script>
