<div th:fragment="content" class="admin-section">
    <style>
        .reporte-tab-btn {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            color: var(--text-secondary); padding: 10px 18px; border-radius: var(--radius-md);
            cursor: pointer; font-family: var(--font-body); font-size: 0.85rem; font-weight: 600;
            transition: all 0.2s;
        }
        .reporte-tab-btn:hover { color: white; border-color: var(--accent); }
        .reporte-tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        
        .date-input {
            background: var(--bg-tertiary); border: 1px solid var(--border-color);
            color: white; padding: 8px 12px; border-radius: var(--radius-md);
            font-family: var(--font-body); font-size: 0.85rem;
        }
    </style>

    <!-- KPIs -->
    <div class="admin-kpi-grid" style="margin-bottom: 24px;">
        <div class="glass-card kpi-card">
            <div class="kpi-icon">💰</div>
            <div class="kpi-data">
                <span class="kpi-label">Ingresos Totales</span>
                <span class="kpi-value" th:text="${#numbers.formatCurrency(kpis.ingresosDia)}">S/ 0.00</span>
            </div>
        </div>
        <div class="glass-card kpi-card">
            <div class="kpi-icon">🧾</div>
            <div class="kpi-data">
                <span class="kpi-label">Pedidos Cobrados</span>
                <span class="kpi-value" th:text="${kpis.ordenesCompletadas} + ' pedidos'">0 pedidos</span>
            </div>
        </div>
        <div class="glass-card kpi-card">
            <div class="kpi-icon">🎯</div>
            <div class="kpi-data">
                <span class="kpi-label">Ticket Promedio</span>
                <span class="kpi-value" th:text="${#numbers.formatCurrency(kpis.ticketPromedio)}">S/ 0.00</span>
            </div>
        </div>
    </div>

    <!-- Sub-tabs de reportes con HTMX -->
    <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;" hx-target="#reporte-tab-content">
        <button class="reporte-tab-btn active" hx-get="/admin/reportes/dashboard" onclick="updateSubTab(this)">📈 Dashboard</button>
        <button class="reporte-tab-btn" hx-get="/admin/reportes/dia" onclick="updateSubTab(this)">📅 Reporte del Día</button>
        <button class="reporte-tab-btn" hx-get="/admin/reportes/historico" onclick="updateSubTab(this)">📦 Todo lo Vendido</button>
        <button class="reporte-tab-btn" hx-get="/admin/reportes/personalizado" onclick="updateSubTab(this)">🔍 Por Período</button>
    </div>

    <div id="reporte-tab-content">
        <!-- Por defecto carga el dashboard -->
        <div th:replace="~{admin/reportes/dashboard :: content}"></div>
    </div>

    <script>
        function updateSubTab(btn) {
            document.querySelectorAll('.reporte-tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</div>
