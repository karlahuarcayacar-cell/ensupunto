<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Admin Dashboard')}"></head>
<body>
<div class="app-container">
    <header th:replace="~{fragments/header :: navbar}"></header>

    <main class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
            <div>
                <h1 style="font-size: 1.8rem; color: white;">Panel de Control Administrativo</h1>
                <p style="color: var(--text-secondary); font-size: 0.9rem;">Gestión de menú de platos, cuentas de personal y analítica de ventas.</p>
            </div>
        </div>

        <!-- Tabs principales con HTMX -->
        <nav style="display: flex; gap: 0; border-bottom: 2px solid var(--border-color); margin-bottom: 24px;" hx-target="#admin-content" hx-push-url="true">
            <button class="admin-main-tab" 
                    th:classappend="${activeTab == 'reportes' ? 'active' : ''}"
                    hx-get="/admin/reportes" 
                    onclick="updateActiveTab(this)">📊 Reportes y Ventas</button>
            <button class="admin-main-tab" 
                    th:classappend="${activeTab == 'platos' ? 'active' : ''}"
                    hx-get="/admin/platos" 
                    onclick="updateActiveTab(this)">🍽️ Carta de Platos</button>
            <button class="admin-main-tab" 
                    th:classappend="${activeTab == 'personal' ? 'active' : ''}"
                    hx-get="/admin/personal" 
                    onclick="updateActiveTab(this)">👥 Personal y Acceso</button>
            <button class="admin-main-tab" 
                    th:classappend="${activeTab == 'mesas' ? 'active' : ''}"
                    hx-get="/admin/mesas" 
                    onclick="updateActiveTab(this)">🪑 Mesas del Salón</button>
        </nav>

        <style>
            .admin-main-tab {
                background: none; border: none; color: var(--text-secondary);
                font-family: var(--font-title); font-size: 0.9rem; font-weight: 600;
                padding: 10px 20px; cursor: pointer; border-bottom: 3px solid transparent;
                margin-bottom: -2px; transition: all 0.2s ease;
            }
            .admin-main-tab:hover { color: white; }
            .admin-main-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

            /* Estilos comunes para tablas y otros elementos del admin */
            .admin-table { width: 100%; border-collapse: collapse; }
            .admin-table th {
                background: var(--bg-tertiary); color: white;
                font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px;
                padding: 12px 16px; text-align: left; font-weight: 600;
            }
            .admin-table td { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.88rem; }
            .admin-table tr:hover td { background: rgba(255,255,255,0.02); }

            .role-pill {
                padding: 3px 10px; border-radius: 50px;
                font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
            }
            .role-pill.mesero { background: rgba(245,158,11,0.15); color: #fbbf24; }
            .role-pill.chef { background: rgba(239,68,68,0.15); color: #f87171; }
            .role-pill.cajero { background: rgba(16,185,129,0.15); color: #34d399; }
            .role-pill.admin { background: rgba(139,92,246,0.15); color: #a78bfa; }
            .role-pill.efectivo { background: rgba(16,185,129,0.15); color: #34d399; }
            .role-pill.tarjeta { background: rgba(59,130,246,0.15); color: #60a5fa; }
            .role-pill.yape { background: rgba(139,92,246,0.15); color: #a78bfa; }

            .cat-pill {
                padding: 3px 10px; border-radius: 50px;
                font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
            }
            .cat-pill.entradas { background: rgba(16,185,129,0.15); color: #34d399; }
            .cat-pill.segundos { background: rgba(239,68,68,0.15); color: #f87171; }
            .cat-pill.bebidas { background: rgba(59,130,246,0.15); color: #60a5fa; }
            .cat-pill.postres { background: rgba(139,92,246,0.15); color: #a78bfa; }

            /* HTMX Request Loading Feedback */
            #admin-content.htmx-request, #reporte-tab-content.htmx-request {
                opacity: 0.5;
                filter: blur(1.5px);
                pointer-events: none;
                transition: all 0.2s ease;
            }
            .htmx-indicator {
                display: none;
            }
            .htmx-request .htmx-indicator, .htmx-request.htmx-indicator {
                display: block;
            }
        </style>

        <div id="admin-content">
            <!-- Contenido dinámico cargado por HTMX -->
            <div th:replace="~{admin/__${contentTemplate}__}"></div>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block>

<script>
    function updateActiveTab(btn) {
        document.querySelectorAll('.admin-main-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function previsualizarReporte(type) {
        let url = '';
        if (type === 'dia') {
            url = '/admin/reporte/ventas';
        } else if (type === 'historico') {
            url = '/admin/reporte/historico';
        } else if (type === 'personalizado') {
            const desdeEl = document.getElementById('fecha-desde');
            const hastaEl = document.getElementById('fecha-hasta');
            const desde = desdeEl ? desdeEl.value : '';
            const hasta = hastaEl ? hastaEl.value : '';
            if (!desde || !hasta) {
                showCustomModal(
                    "Alerta", 
                    "<p style='color:white;'>Por favor, seleccione un rango de fechas válido antes de previsualizar el reporte.</p>", 
                    [{ text: "Entendido", class: "btn-primary", onClick: closeGlobalModal }]
                );
                return;
            }
            url = `/admin/reporte/periodo?desde=${desde}&hasta=${hasta}`;
        }

        const bodyHtml = `
            <div style="height: 550px; width: 100%; display: flex; flex-direction: column;">
                <div id="pdf-preview-loading" style="color: var(--accent); text-align: center; padding: 20px 0; font-weight: bold;">
                    ⏳ Generando previsualización del PDF...
                </div>
                <iframe src="${url}" style="width: 100%; height: 100%; border: none; border-radius: 8px; display: none;" onload="document.getElementById('pdf-preview-loading').style.display='none'; this.style.display='block';"></iframe>
            </div>
        `;

        showCustomModal(
            "Vista Previa del Reporte", 
            bodyHtml, 
            [
                { 
                    text: "🖨️ Imprimir Reporte", 
                    class: "btn-primary", 
                    onClick: function() {
                        const iframeEl = document.querySelector("#global-modal-overlay iframe");
                        if (iframeEl) {
                            iframeEl.contentWindow.focus();
                            iframeEl.contentWindow.print();
                        }
                    } 
                },
                { text: "Cerrar", class: "btn-secondary", onClick: closeGlobalModal }
            ]
        );
    }
</script>
</body>
</html>
