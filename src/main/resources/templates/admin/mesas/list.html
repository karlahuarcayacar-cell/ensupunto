<div th:fragment="content" class="admin-section">
    <div class="glass-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <div>
                <h3 style="color:white; font-size:1.1rem;">Mesas del Salón</h3>
                <p style="color:var(--text-secondary); font-size:0.85rem;">Agrega, modifica o elimina las mesas físicas del salón de atención.</p>
            </div>
            <button class="btn btn-primary" hx-get="/admin/mesas/nuevo" hx-target="body" hx-swap="beforeend">+ Nueva Mesa</button>
        </div>
        
        <!-- Alertas de éxito y error -->
        <div th:if="${errorMsg}" style="background: rgba(239,68,68,0.15); color: #f87171; padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; border: 1px solid rgba(239,68,68,0.3); font-size: 0.88rem; display: flex; align-items: center; gap: 8px;">
            <span>⚠️</span> <span th:text="${errorMsg}">Error message</span>
        </div>
        <div th:if="${successMsg}" style="background: rgba(16,185,129,0.15); color: #34d399; padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; border: 1px solid rgba(16,185,129,0.3); font-size: 0.88rem; display: flex; align-items: center; gap: 8px;">
            <span>✅</span> <span th:text="${successMsg}">Success message</span>
        </div>

        <table class="admin-table">
            <thead>
                <tr>
                    <th>Nombre de la Mesa</th>
                    <th>Estado de la Mesa</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="m : ${mesas}">
                    <td style="color:white; font-weight:600;" th:text="${m.nombre}">Mesa 1</td>
                    <td>
                        <span class="status-pill" 
                              th:style="${m.estado == 'libre' ? 'background: rgba(16,185,129,0.15); color: #34d399; padding: 3px 10px; border-radius: 50px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase;' : 'background: rgba(245,158,11,0.15); color: #fbbf24; padding: 3px 10px; border-radius: 50px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase;'}"
                              th:text="${#strings.toUpperCase(#strings.replace(m.estado, '_', ' '))}">LIBRE</span>
                    </td>
                    <td style="display:flex; gap:8px;">
                        <button class="btn btn-secondary btn-sm" 
                                th:hx-get="'/admin/mesas/editar/' + ${m.id}" 
                                hx-target="body" hx-swap="beforeend">Editar</button>
                        <button class="btn btn-danger btn-sm" 
                                th:hx-delete="'/admin/mesas/' + ${m.id}"
                                hx-confirm="¿Estás segura de que deseas eliminar esta mesa? Si tiene pedidos activos o históricos, la operación podría fallar."
                                hx-target="#admin-content">Eliminar</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
