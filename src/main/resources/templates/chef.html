<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Chef Dashboard')}"></head>
<body>
    <div class="app-container">
        <header th:replace="~{fragments/header :: navbar}"></header>
        
        <main class="main-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">  
                <div>
                    <h1 style="font-size: 1.8rem; color: white;">Monitor de Cocina (KDS)</h1>
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">Gestión de tickets y tiempos de preparación.</p>
                </div>
            </div>
            
            <div class="kitchen-grid" id="kitchen-grid">
                <!-- Tickets loaded here via JS -->
            </div>
        </main>
    </div>

    <th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block>

    <script th:inline="javascript">
        function updateTimers() {
            document.querySelectorAll('.timer-display').forEach(el => {
                const created = new Date(el.getAttribute('data-time')).getTime();
                const now = new Date().getTime();
                const diff = now - created;
                
                let m = Math.floor(diff / 60000);
                let s = Math.floor((diff % 60000) / 1000);
                
                el.innerText = `⏱ ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                
                if (m >= 15) {
                    el.style.color = '#ef4444';
                    el.style.fontWeight = 'bold';
                }
            });
        }

        setInterval(updateTimers, 1000);

        function loadOrders() {
            fetch('/chef/api/pedidos')
                .then(res => res.json())
                .then(pedidos => {
                    const grid = document.getElementById('kitchen-grid');
                    grid.innerHTML = '';
                    
                    if(pedidos.length === 0) {
                        grid.innerHTML = '<p style="color:gray;">No hay pedidos pendientes.</p>';
                        return;
                    }

                    pedidos.forEach(p => {
                        const isPrep = p.estado === 'cocina_preparacion';
                        const ticketClass = isPrep ? 'ticket-preparacion' : '';
                        
                        let statusText = 'En Cola';
                        let statusClass = 'badge-waiting';
                        if (isPrep) {
                            statusText = 'Preparando';
                            statusClass = 'badge-cooking';
                        }
                        
                        let itemsHtml = '';
                        p.detalles.forEach(d => {
                            itemsHtml += `
                                <div class="ticket-item">
                                    <div class="ticket-item-row">
                                        <div class="ticket-item-qty">${d.cantidad}</div>
                                        <div class="ticket-item-name">${d.plato.nombre}</div>
                                    </div>
                                    ${d.nota ? `<div class="ticket-item-note" style="color: #f59e0b;">⚠️ ${d.nota}</div>` : ''}
                                </div>
                            `;
                        });

                        grid.innerHTML += `
                            <div class="kitchen-ticket ${ticketClass}">
                                <div class="kitchen-ticket-header">
                                    <div class="ticket-meta">
                                        <span class="ticket-table-name">${p.mesa.nombre}</span>
                                        <span class="badge ${statusClass}" style="margin-left: 10px;">${statusText}</span>
                                        <span class="ticket-id" style="margin-left: auto;">#${p.id}</span>
                                    </div>
                                    <div class="timer-display" data-time="${p.fechaCreacion}" style="font-family: monospace; font-size: 1.1rem; color: var(--text-secondary); margin-top: 5px;">⏱ 00:00</div>
                                </div>
                                <div class="kitchen-ticket-body">
                                    ${itemsHtml}
                                </div>
                                <div class="kitchen-ticket-footer">
                                    ${p.estado === 'cocina_pendiente' ? `<button class="btn btn-primary" style="width: 100%;" onclick="prepararPedido(${p.id})">👨‍🍳 Preparar Ahora</button>` : ''}
                                    ${p.estado === 'cocina_preparacion' ? `<button class="btn btn-success" style="width: 100%;" onclick="terminarPedido(${p.id})">✅ Terminado</button>` : ''}
                                </div>
                            </div>
                        `;
                    });
                    updateTimers();
                });
        }

        function prepararPedido(id) {
            fetch(`/chef/api/pedidos/${id}/preparar`, { method: 'PUT' }).then(() => loadOrders());
        }

        function terminarPedido(id) {
            fetch(`/chef/api/pedidos/${id}/terminar`, { method: 'PUT' }).then(() => loadOrders());
        }

        loadOrders();
        setInterval(loadOrders, 5000);
    </script>
</body>
</html>
