# ====================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN SPRING BOOT
# ====================================================================

# Nombre de la aplicación (usado en registros de logs y Eureka si se usaran microservicios)
spring.application.name=ensupunto

# Puerto TCP en el que se levantará el servidor web embebido (Apache Tomcat)
server.port=8080

# ====================================================================
# CONFIGURACIÓN DE ACCESO A DATOS (DATASOURCE - JDBC)
# ====================================================================
# URL de conexión a la base de datos MySQL:
# - 'ensupunto_db': Nombre de la base de datos física configurada en MySQL.
# - 'useSSL=false': Deshabilita cifrado SSL para simplificar la conexión local.
# - 'serverTimezone=UTC': Define la zona horaria del servidor de datos para sincronizar campos TIMESTAMP.
# - 'allowPublicKeyRetrieval=true': Permite al driver de MySQL recuperar la clave pública de cifrado del servidor.
spring.datasource.url=jdbc:mysql://localhost:3306/ensupunto_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Credenciales de acceso del motor de base de datos
spring.datasource.username=root
spring.datasource.password=mysql

# Nombre calificado de la clase Driver JDBC correspondiente a MySQL (MySQL Connector/J)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====================================================================
# CONFIGURACIÓN DE PERSISTENCIA (JPA / HIBERNATE)
# ====================================================================
# ddl-auto=none:
# Indica a Hibernate que NO intente alterar la estructura de la base de datos en el arranque (no crea ni borra tablas).
# En entornos de desarrollo/producción profesionales se prefiere 'none' o 'validate',
# y las modificaciones se controlan mediante scripts SQL manuales (como db_restaurante.sql) o herramientas como Liquibase/Flyway.
# Otras opciones académicas:
# - 'create-drop': Crea las tablas al iniciar y las borra al apagar (pierde datos).
# - 'update': Modifica la estructura de las tablas agregando columnas nuevas (puede ser inestable).
spring.jpa.hibernate.ddl-auto=none

# show-sql=true:
# Imprime en la consola de Spring Boot todas las sentencias SQL reales que Hibernate genera y ejecuta por debajo.
# Es una herramienta de depuración invaluable en el ámbito académico para analizar índices, JOINS y queries N+1.
spring.jpa.show-sql=true

# Dialecto SQL de Hibernate:
# Le indica a Hibernate el motor de BD usado para que genere sentencias optimizadas con las funciones nativas de MySQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ====================================================================
# CONFIGURACIÓN DEL MOTOR DE VISTAS (THYMELEAF)
# ====================================================================
# Deshabilita la caché de plantillas para que los cambios en los archivos HTML
# se reflejen en el navegador al recargar la vista, sin necesidad de reiniciar la aplicación.
spring.thymeleaf.cache=false

# Prefijo y sufijo por defecto para resolver los nombres de las vistas en los controladores.
# Si el controlador retorna "login", Spring buscará el archivo en "classpath:/templates/login.html".
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
